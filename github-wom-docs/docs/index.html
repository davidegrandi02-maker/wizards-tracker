<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1a48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wizards of Mickey">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Wizards of Mickey – Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Alegreya:wght@500;700;800&display=swap">
<style>
:root{--ink:#3b1f0b;--ink2:#7a4a22;--brown:#5a2f12;--par1:#f6dca8;--par2:#dcae6e;--teal:#1b8aa6;--deep:#0a3550;--sky:#35b3ee;--orange:#e8731f;--cream:#fbeccb;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .2 0 0 0 0 .06 0 0 0 .34 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
--blot:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.013' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .27 0 0 0 0 .08 0 0 0 .55 -.12'/></filter><rect width='100%25' height='100%25' filter='url(%23b)'/></svg>");
--parch:var(--noise),var(--blot),linear-gradient(180deg,#f8e0b0,#d9a860);
--disp:"Almendra",Georgia,"Times New Roman",serif;--body:"Alegreya",Georgia,serif}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:#fff;font-family:var(--body);font-size:17px;
background:
radial-gradient(1.5px 1.5px at 8% 14%,#fff 50%,transparent),radial-gradient(1px 1px at 22% 40%,#fff 50%,transparent),
radial-gradient(2px 2px at 36% 8%,#ffe9a8 50%,transparent),radial-gradient(1px 1px at 52% 30%,#fff 50%,transparent),
radial-gradient(1.5px 1.5px at 67% 12%,#fff 50%,transparent),radial-gradient(2px 2px at 83% 36%,#ffe9a8 50%,transparent),
radial-gradient(1px 1px at 93% 8%,#fff 50%,transparent),radial-gradient(1.5px 1.5px at 15% 70%,#fff 50%,transparent),
radial-gradient(1px 1px at 60% 82%,#fff 50%,transparent),radial-gradient(2px 2px at 88% 66%,#ffe9a8 50%,transparent),
radial-gradient(ellipse 70% 28% at 50% 0%,rgba(80,200,230,.35),transparent 70%),
radial-gradient(ellipse 60% 25% at 50% 100%,rgba(232,115,31,.16),transparent 70%),
linear-gradient(180deg,#12507c 0%,#0e2f66 38%,#0a1a48 75%,#070f2c 100%);background-attachment:fixed}
button,select,input,textarea{font-family:inherit}
.player::after{content:"";position:absolute;inset:0;border-radius:inherit;border:5px solid transparent;pointer-events:none;z-index:2;
background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%) border-box;background-size:260% 100%;animation:sheen 7s linear infinite;
-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);mix-blend-mode:overlay}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sp{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,233,168,.9) 35%,transparent 70%);animation:tw var(--t,4s) ease-in-out infinite;transition:transform .25s ease-out}
@keyframes tw{50%{opacity:.12;scale:.6}}
.card3d{perspective:900px}
.tilt{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out;will-change:transform}
.card3d.rest .tilt{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.flipper{display:grid;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.3,.8,.3,1)}
.flipper.flip{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;position:relative;transform-style:preserve-3d}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.55),transparent 55%);mix-blend-mode:soft-light;opacity:var(--go,0);transition:opacity .2s}
.face .crest{transform:translateZ(28px);backface-visibility:hidden;filter:drop-shadow(0 6px 5px rgba(0,0,0,.4))}
.face .portrait{transform:translateZ(14px);backface-visibility:hidden}
.ab.tall{min-height:150px;flex:1}
.flipbtn{width:100%;border:2px solid var(--brown);border-radius:8px;background:linear-gradient(180deg,#fff0c8,#e0b273);color:var(--brown);font-weight:800;font-size:.8rem;padding:4px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
.flipbtn:hover{background:linear-gradient(180deg,#ffd9a0,var(--orange));color:#fff}
.sart{position:relative;display:block;width:100%;aspect-ratio:16/10;border:2px solid var(--brown);border-radius:8px;overflow:hidden;cursor:pointer}
.sart img{width:100%;height:100%;object-fit:cover;display:block}
.ph.s{background:radial-gradient(circle at 50% 35%,#7fdcf5,#1b4f86 85%)}
.ph.s span{font-size:.95rem;-webkit-text-stroke:3px rgba(0,0,0,.6)}
.imp{display:inline-block;margin-left:10px;border:2px solid var(--brown);border-radius:999px;background:var(--parch);color:var(--ink);font-family:var(--disp);font-weight:700;padding:5px 14px;cursor:pointer;box-shadow:inset 0 0 16px rgba(90,47,18,.5)}
.status{min-height:1.2em;font-size:.9rem;color:#ffe9a8;margin-top:6px}
.reserve label{cursor:pointer}
.dia .big img{animation:spin 5s linear infinite}
@keyframes spin{from{transform:perspective(140px) rotateY(0)}to{transform:perspective(140px) rotateY(360deg)}}
img.d{transition:transform .4s}
.chip:hover img.d{transform:perspective(100px) rotateY(180deg) scale(1.2)}
img.d{height:24px;width:auto;flex:none;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
@media (prefers-reduced-motion:reduce){.player::after,.sp,.dia .big img,.flipper,.tilt{animation:none!important;transition:none!important}}
/* titolo: logo ritagliato dalla copertina */
.logo{background:none!important;border:0!important;box-shadow:none!important;padding:0 8px!important;margin:0!important;max-width:100%!important}
.logo::before,.logo::after{display:none!important}
.logo h1{transform:none;-webkit-text-stroke:0;text-shadow:none;line-height:0;font-size:1rem}
img.wom{display:block;width:min(560px,92vw);height:auto;margin:0 auto;filter:drop-shadow(3px 5px 4px rgba(20,5,0,.75)) drop-shadow(0 0 16px rgba(255,170,60,.35))}
.logo .sub{display:inline-block;margin-top:8px;padding:3px 16px;border:2px solid var(--brown);border-radius:999px;background:var(--parch);font-size:.9rem}
header,main{position:relative;z-index:1}
header{text-align:center;padding:22px 16px 6px}
.logo{position:relative;display:inline-block;max-width:calc(100% - 52px);margin:0 24px;padding:14px clamp(26px,6vw,46px) 16px;background:var(--parch);border:3px solid var(--brown);border-radius:6px;box-shadow:0 0 0 3px #e9bf4f,0 0 0 5px #3a2506,0 10px 20px rgba(0,0,0,.5),inset 0 0 0 3px rgba(246,220,168,.8),inset 0 0 26px rgba(90,47,18,.55)}
.logo::before,.logo::after{content:"";position:absolute;top:-12px;bottom:-12px;width:26px;border-radius:14px;border:3px solid var(--brown);background:linear-gradient(90deg,#8a5a2b,#f6dca8 35%,#d9a860 60%,#7a4a22);box-shadow:0 4px 8px rgba(0,0,0,.5),inset 0 0 0 2px #e9bf4f}
.logo::before{left:-24px}.logo::after{right:-24px}
h1{margin:0;font-family:var(--disp);font-weight:700;font-size:clamp(1.9rem,6vw,3.2rem);line-height:1;color:#ffe08a;-webkit-text-stroke:7px #0b1d45;paint-order:stroke fill;letter-spacing:.02em;transform:rotate(-1.5deg);text-shadow:0 0 18px rgba(255,200,80,.55)}
.sub{color:var(--ink);font-family:var(--disp);font-weight:700;font-size:.95rem;margin-top:2px}
.count{display:inline-flex;align-items:center;gap:12px;margin:16px 0 6px;padding:5px 16px;border:2px solid var(--brown);border-radius:999px;background:var(--parch);color:var(--ink);font-family:var(--disp);font-weight:700;font-size:1rem}
.count b{font-size:1.3rem;min-width:16px}
.reserve{display:inline-flex;gap:10px;align-items:center;margin:0 0 0 10px;padding:5px 14px;border:2px solid var(--brown);border-radius:999px;background:var(--parch);color:var(--ink);font-family:var(--disp);font-weight:700;font-size:.95rem}
.reserve span{display:inline-flex;align-items:center;gap:3px}
.rb{width:30px;height:30px;border-radius:50%;border:2px solid var(--brown);background:linear-gradient(180deg,#fff0c8,#e0b273);color:var(--brown);font-weight:900;cursor:pointer;font-size:1rem;line-height:1;padding:0;box-shadow:0 2px 0 rgba(90,47,18,.5),inset 0 1px 0 rgba(255,255,255,.75)}
.rb:hover:not(:disabled){background:linear-gradient(180deg,#ffd9a0,var(--orange));color:#fff}
.rb:active:not(:disabled){transform:translateY(1px);box-shadow:none}
.rb:disabled{opacity:.35;cursor:default}
main{display:grid;gap:24px;padding:14px 18px 28px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));max-width:1400px;margin:0 auto}
.player{position:relative;border-radius:20px;padding:5px;background:conic-gradient(from 30deg at 50% 50%,#fff1b8,#b8862b 18%,#f6d777 34%,#7a5416 52%,#e9bf4f 70%,#9a6d1c 85%,#fff1b8);box-shadow:0 12px 36px rgba(0,0,0,.6),0 0 24px rgba(240,192,64,.22);border:2px solid #3a2506}
.inner{border-radius:14px;background-size:cover;background-position:center;overflow:hidden;min-height:100%;box-shadow:0 0 0 2px #3a2506}
.shade{background:linear-gradient(180deg,rgba(12,48,100,.38),rgba(6,16,52,.84));padding:14px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.banner{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:2px 0 0}
.ribbon{--clipL:polygon(0 0,100% 0,100% 100%,0 100%,20px 50%);--clipR:polygon(0 0,100% 0,calc(100% - 20px) 50%,100% 100%,0 100%);
position:relative;flex:none;width:100%;min-width:0;max-width:560px;margin:0 auto 14px;padding:0 32px;isolation:isolate;filter:drop-shadow(0 7px 5px rgba(0,0,0,.5))}
/* code di rondine, dietro la fascia */
.tail{position:absolute;top:16px;bottom:-13px;width:68px;z-index:-1;background:linear-gradient(180deg,#fff1b8,#c8922a 55%,#7a5416)}
.tail::before{content:"";position:absolute;inset:3px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 55%),linear-gradient(180deg,var(--k),var(--k-dk))}
.tail.l{left:0;clip-path:var(--clipL)}.tail.l::before{clip-path:var(--clipL)}
.tail.r{right:0;clip-path:var(--clipR)}.tail.r::before{clip-path:var(--clipR)}
/* sigilli d'oro con stella */
.ribbon::before,.ribbon::after{content:"";position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;z-index:2;pointer-events:none;border-radius:50%;
background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 6 C54 34 66 46 94 50 C66 54 54 66 50 94 C46 66 34 54 6 50 C34 46 46 34 50 6Z' fill='%230a2a5c'/><circle cx='50' cy='50' r='7' fill='%23f6d777'/></svg>") center/70% no-repeat,radial-gradient(circle at 35% 30%,#fff6c8,#f0c040 48%,#8a621a);
border:2px solid #3a2506;box-shadow:0 2px 4px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,241,184,.55)}
.ribbon::before{left:42px}.ribbon::after{right:42px}
.name{display:block;width:100%;min-width:0;font-family:var(--disp);font-weight:700;font-size:clamp(1.3rem,5.4vw,1.75rem);letter-spacing:.05em;text-align:center;
color:#ffe08a;text-shadow:0 1px 0 #8a621a,0 2px 0 #3a2506,0 0 14px rgba(255,196,70,.5);caret-color:#ffe08a;
padding:11px 48px 12px;border:2px solid #3a2506;border-radius:4px;
background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px),
linear-gradient(180deg,var(--k-hi) 0,var(--k) 46%,var(--k-dk) 54%,var(--k-md) 100%);
box-shadow:inset 0 0 0 2px #f6d777,inset 0 0 0 3px #3a2506,inset 0 0 0 5px rgba(233,191,79,.55),inset 0 12px 16px rgba(255,255,255,.12),inset 0 -14px 18px rgba(0,0,0,.4);}
.hues{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.hue{position:relative;width:24px;height:24px;flex:none;border-radius:50%;border:2px solid #3a2506;padding:0;cursor:pointer;display:block;
background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.6),transparent 46%),var(--h);box-shadow:0 2px 3px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,241,184,.5)}
.hue.on{box-shadow:0 0 0 2px #fff1b8,0 0 0 4px #3a2506,0 0 10px rgba(255,224,138,.8);transform:scale(1.1)}
.hue:focus-visible,.hue:focus-within{outline:2px solid #ffe08a;outline-offset:3px}
.hue.custom{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),transparent 46%),conic-gradient(#e0413a,#f2c02f,#3fb95a,#35b3ee,#8e44ad,#e0413a)}
.hue.custom.on{background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.6),transparent 46%),var(--h)}
.hue.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.name::placeholder{color:rgba(255,224,138,.5)}
.name:focus{outline:2px solid #ffe08a;outline-offset:3px}
.photo{border:2px solid var(--brown);border-radius:10px;background:var(--parch);color:var(--ink);font-size:.9rem;padding:5px 10px;cursor:pointer;font-weight:800}
.stats{display:flex;gap:12px;align-items:stretch}
.power{flex:1;display:flex;align-items:center;gap:12px;background:var(--parch);color:var(--ink);border:2px solid var(--brown);border-radius:16px;padding:8px 14px}
.orb{position:relative;flex:none;width:62px;height:90px;margin:18px 12px 22px;transform-origin:50% 0;
transform:perspective(340px) rotateY(-9deg) rotateX(3deg);
filter:drop-shadow(0 8px 5px rgba(0,0,0,.45)) drop-shadow(0 0 8px var(--kg1));
animation:glow 3s ease-in-out infinite}
/* asta: cilindro d'oro */
.orb::before{content:"";position:absolute;left:-9px;right:-9px;top:-12px;height:13px;border-radius:7px;z-index:2;
background:linear-gradient(180deg,#5a3a0c 0,#c8922a 14%,#fff6c8 34%,#f0c040 52%,#9a6d1c 78%,#3a2506 100%);
border:2px solid #3a2506;box-shadow:0 3px 3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,241,184,.35)}
/* pomelli sferici alle estremità */
.orb::after{content:"";position:absolute;left:-20px;right:-20px;top:-17px;height:22px;z-index:3;pointer-events:none;
background:
radial-gradient(circle at 6.5px 7px,#fff 0 1.4px,rgba(255,240,170,.65) 3px,transparent 5.5px),
radial-gradient(circle at calc(100% - 11.5px) 7px,#fff 0 1.4px,rgba(255,240,170,.65) 3px,transparent 5.5px),
radial-gradient(circle at 12px 14px,rgba(40,18,0,.4) 0,transparent 6px),
radial-gradient(circle at calc(100% - 12px) 14px,rgba(40,18,0,.4) 0,transparent 6px),
radial-gradient(circle at 9px 10px,#d9a02c 0 6.5px,#3a2506 7px 9px,transparent 9.5px),
radial-gradient(circle at calc(100% - 9px) 10px,#d9a02c 0 6.5px,#3a2506 7px 9px,transparent 9.5px)}
/* stoffa: bordo d'oro bombato + pieghe */
.orb span{position:relative;display:grid;place-items:start center;width:100%;height:100%;padding-top:15px;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);
background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.45) 18%,transparent 48%,rgba(255,255,255,.3) 82%,rgba(0,0,0,.4)),linear-gradient(180deg,#fff1b8,#c8922a 50%,#7a5416)}
.orb span::before{content:"";position:absolute;inset:4px 4px 5px;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);
background:
linear-gradient(180deg,rgba(0,0,0,.6) 0,rgba(0,0,0,.18) 14%,transparent 30%),
linear-gradient(180deg,transparent 62%,rgba(255,235,170,.28) 84%,transparent 100%),
linear-gradient(90deg,rgba(0,0,0,.42) 0,rgba(255,255,255,.2) 15%,rgba(0,0,0,.14) 30%,rgba(255,255,255,.24) 50%,rgba(0,0,0,.2) 68%,rgba(255,255,255,.16) 85%,rgba(0,0,0,.45) 100%),
linear-gradient(180deg,var(--k-hi) 0,var(--k) 45%,var(--k-dk) 100%)}
.orb b{position:relative;z-index:1;font-family:var(--disp);font-weight:700;font-size:2.3rem;line-height:1;color:#fff6d8;
text-shadow:0 1px 0 var(--k-hi),0 2px 0 var(--k),0 3px 0 var(--k-dk),0 4px 0 var(--k-dk2),0 5px 0 var(--k-dk3),0 9px 8px rgba(40,8,0,.55),0 0 12px rgba(255,220,120,.55)}
/* nappa dorata sotto la punta */
.tas{position:absolute;left:50%;top:calc(82% - 5px);width:14px;height:30px;margin-left:-7px;z-index:0;pointer-events:none;
background:radial-gradient(circle at 5px 5px,#fff6c8 0,#f0c040 3px,#7a5416 7px,transparent 7.5px) 3px 0/14px 14px no-repeat,
linear-gradient(90deg,#7a5416,#fff1b8 40%,#c8922a 70%,#5a3a0c) 0 12px/100% 18px no-repeat;
clip-path:polygon(38% 0,62% 0,62% 38%,100% 100%,0 100%,38% 38%)}
@keyframes glow{50%{filter:drop-shadow(0 8px 5px rgba(0,0,0,.45)) drop-shadow(0 0 16px var(--kg2))}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
.plabel{font-family:var(--disp);font-weight:700;font-size:1.05rem;color:var(--brown)}
.psub{font-size:.9rem;color:var(--ink2)}
.dia{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:86px;background:var(--parch);border:2px solid var(--brown);border-radius:16px;color:var(--ink);padding:6px 10px}
.dia .big{font-family:var(--disp);font-weight:700;font-size:1.6rem;display:flex;align-items:center;gap:6px;color:var(--brown)}
.dia small{font-size:.75rem;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pool{display:flex;background:var(--parch);border:2px solid var(--brown);border-radius:14px;padding:8px 10px;flex-direction:column;gap:6px;color:var(--ink)}
.hid{display:flex;flex-direction:column;gap:7px;background:var(--parch);border:2px solid var(--brown);border-radius:12px;padding:7px 8px 8px;color:var(--ink);box-shadow:inset 0 0 16px rgba(90,47,18,.5)}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hl{font-family:var(--disp);font-weight:700;font-size:1rem;color:var(--brown)}
.htot{min-width:30px;text-align:center;font-family:var(--disp);font-weight:700;font-size:1.15rem;line-height:1;color:#ffe08a;padding:4px 8px;border:2px solid #3a2506;border-radius:999px;background:linear-gradient(180deg,#16508a,#0a2a5c);box-shadow:inset 0 0 0 1.5px #e9bf4f}
.hlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:70px;padding:6px 4px 5px;border:2px solid #3a2506;border-radius:9px;
background:repeating-linear-gradient(45deg,rgba(246,215,119,.14) 0 3px,transparent 3px 9px),linear-gradient(160deg,#1d62a0,#0a2a5c);box-shadow:inset 0 0 0 2px #e9bf4f,0 3px 5px rgba(0,0,0,.45)}
.hcard b{font-family:var(--disp);font-weight:700;font-size:1.7rem;line-height:1;color:#ffe08a;text-shadow:0 2px 0 #3a2506,0 0 10px rgba(255,200,80,.5)}
.hcard .hs{display:flex;gap:6px}
.hcard .rb{width:22px;height:22px;font-size:.8rem}
.hx{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:2px solid #3a2506;background:linear-gradient(180deg,#ffa99d,#c0392b);color:#fff;font-weight:900;font-size:.75rem;line-height:1;padding:0;cursor:pointer;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.csym{width:18px;height:18px;flex:none;margin-right:5px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.mod .cl{display:inline-flex;align-items:center}
.fx{background:linear-gradient(180deg,#bff0c6,#5fc77a);border:2px solid #14532d;border-radius:8px;color:#0c3a1d;font-weight:800;font-size:.78rem;padding:2px 6px;text-align:center;line-height:1.15}
.fx.bad{background:linear-gradient(180deg,#ffb4ab,#e2463f);border-color:#5a0f0c;color:#4a0b08}
.castle{display:flex;align-items:center;gap:10px;padding:7px 12px;border:2px solid #3a2506;border-radius:6px;
background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px),linear-gradient(180deg,var(--k-hi) 0,var(--k) 46%,var(--k-dk) 54%,var(--k-md) 100%);
box-shadow:inset 0 0 0 2px #f6d777,inset 0 0 0 3px #3a2506,0 4px 6px rgba(0,0,0,.4)}
#castle{position:relative;z-index:1;width:calc(100% - 36px);max-width:560px;margin:10px auto 2px}
.castle .tw{width:28px;height:28px;flex:none;filter:drop-shadow(0 2px 1px rgba(0,0,0,.45))}
.castle .cn{font-family:var(--disp);font-weight:700;font-size:1.1rem;color:#ffe08a;text-shadow:0 1px 0 #8a621a,0 2px 0 #3a2506}
.cbtn{flex:1;min-width:0;position:relative;text-align:left;background:rgba(5,15,40,.45);color:#fff6d8;border:1.5px solid #e9bf4f;border-radius:6px;font-family:var(--disp);font-weight:700;font-size:1rem;padding:5px 26px 5px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn::after{content:"▾";position:absolute;right:9px;color:#ffe08a}
.cbtn.empty{color:rgba(255,246,216,.6);font-weight:600}
.cbtn:focus-visible{outline:2px solid #ffe08a;outline-offset:2px}
.hempty{font-size:.85rem;color:var(--ink2);font-style:italic;text-align:center}
.poolrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.row{display:flex;align-items:center;gap:10px}.row .lbl{flex:1}
.num{min-width:24px;text-align:center;font-family:var(--disp);font-weight:700}
.win{background:linear-gradient(180deg,#e2463f,#a8221e);border:2px solid #5a0f0c;text-align:center;font-family:var(--disp);font-weight:700;color:#fff;padding:6px;border-radius:10px;font-size:1.1rem}
.pen{font-size:.85rem;color:#a8221e;font-weight:800}
.wizards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.wslot{display:flex;flex-direction:column;gap:6px;min-width:0}
.flipper,.face,.face>div,.tilt,.card3d{min-width:0}
.card3d{position:relative}.card3d:hover{z-index:5}
.mod{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--parch);border:2px solid var(--brown);border-radius:10px;padding:3px 8px;font-size:.8rem;color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.mod select{background:var(--cream);color:var(--ink);border:1.5px solid var(--brown);border-radius:6px;font-family:var(--disp);font-weight:700;font-size:1rem;padding:2px 4px}
.card{border-radius:14px;padding:3px;background:linear-gradient(160deg,#7a3f16,var(--brown) 50%,#7a3f16)}
.card>div{border-radius:11px;background:var(--parch);color:var(--ink);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
.crest{position:relative;width:74px;height:64px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:2rem;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);
border:3px solid #3a2506;border-radius:10px 10px 36px 36px/10px 10px 44px 44px;
background:linear-gradient(180deg,#63c8e4 0,#1b8aa6 55%,#0e4d70 100%);box-shadow:inset 0 0 0 2px #e9bf4f,inset 0 -10px 14px rgba(0,0,0,.25)}
.crest::before{content:"";position:absolute;left:8px;right:8px;top:4px;height:10px;border-radius:6px;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);pointer-events:none}
.crest.pos{background:linear-gradient(180deg,#9be8a6 0,#2da24b 55%,#125a28 100%)}
.crest.neg{background:linear-gradient(180deg,#ffa99d 0,#d8453a 55%,#7d1912 100%)}
.base{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.base .rb{width:24px;height:24px;font-size:.85rem}
.wname{width:100%;text-align:center;background:transparent;border:0;border-bottom:1.5px dashed var(--brown);color:var(--ink);font-family:var(--disp);font-weight:700;font-size:1rem;padding:3px}
.gems{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
.chip{display:flex;align-items:center;justify-content:space-between;gap:2px;background:rgba(90,47,18,.16);border:1px solid rgba(90,47,18,.4);border-radius:999px;padding:2px 3px 2px 6px;color:var(--ink)}
.chip .rb{width:19px;height:19px;font-size:.7rem}
.chip b{font-family:var(--disp);min-width:12px;text-align:center;font-size:.95rem}
.poolrow .chip{padding:3px 4px 3px 6px}

.team{font-size:.72rem;color:var(--brown);font-weight:800;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:4px;align-items:center;width:100%}
.team select{flex:1;min-width:0;background:var(--cream);color:var(--ink);border:1.5px solid var(--brown);border-radius:6px;font-size:.82rem}
.ab{width:100%;min-height:74px;resize:vertical;background:var(--cream);border:1.5px solid var(--brown);border-radius:8px;color:var(--ink);font-family:var(--body);font-size:.9rem;padding:5px;line-height:1.2}
.ab::placeholder{color:#a37b4c}
.tag{font-size:.75rem;color:var(--ink2);font-weight:700}
.pickbtn{width:100%;text-align:left;background:var(--cream);color:var(--ink);border:1.5px solid var(--brown);border-radius:8px;font-family:var(--body);font-weight:700;font-size:.92rem;padding:5px 24px 5px 8px;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn::after{content:"▾";position:absolute;right:8px;color:var(--brown)}
.pickbtn.empty{color:#a37b4c;font-weight:600}
.snote{font-size:.8rem;color:var(--ink2);font-style:italic;line-height:1.15;width:100%}
.slabel{font-size:.72rem;color:var(--brown);font-weight:800;letter-spacing:.08em;text-transform:uppercase;width:100%}
.popup{position:fixed;z-index:60;background:var(--parch);color:var(--ink);border:3px solid var(--brown);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;max-height:min(62vh,380px);overflow:hidden}
.popup input{margin:8px;background:var(--cream);color:var(--ink);border:1.5px solid var(--brown);border-radius:8px;padding:7px 10px;font-size:1rem}
.popup ul{list-style:none;margin:0;padding:0 4px 6px;overflow:auto}
.popup li{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:.98rem;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.popup li:hover,.popup li.on{background:rgba(232,115,31,.3)}
.popup li small{color:var(--ink2);white-space:nowrap;font-weight:600}
.popup .none{padding:10px;color:var(--ink2);font-size:.9rem}
.power,.dia,.pool,.mod,.count,.reserve,.card>div,.photo{box-shadow:inset 0 0 16px rgba(90,47,18,.5)}
.orn{position:absolute;width:22px;height:22px;border-radius:50%;z-index:3;background:radial-gradient(circle at 35% 30%,#fff6c8,#f0c040 45%,#8a621a);border:2px solid #3a2506;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.orn::after{content:"";position:absolute;inset:6px;background:#3a2506;transform:rotate(45deg)}
.orn.tl{left:-9px;top:-9px}.orn.tr{right:-9px;top:-9px}.orn.bl{left:-9px;bottom:-9px}.orn.br{right:-9px;bottom:-9px}
.portrait{position:relative;display:block;width:100%;aspect-ratio:4/5;border-radius:10px;overflow:hidden;border:2px solid var(--brown);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff}
.ph svg{width:52%}
.ph span{font-family:var(--disp);font-weight:700;font-size:1.15rem;-webkit-text-stroke:4px rgba(0,0,0,.65);paint-order:stroke fill;text-align:center;padding:0 4px}
.cam{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);border-radius:8px;padding:1px 6px;font-size:.8rem}
</style>
</head>

const gem=h=>{const c=COLORS.find(x=>x.hex===h);return `<img class="d" src="${GEMPNG[c.id]}" alt="${c.label}">`};
const gemAll=()=>`<img class="d" style="height:30px" src="${GEMPNG.all}" alt="Diamagic">`;
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const act=()=>state.players.slice(0,state.n);
const assigned=(p,c)=>p.wizards.reduce((a,w)=>a+w.dia[c],0);
const reserve=c=>4-act().reduce((a,p)=>a+p.owned[c],0);
const UNUS='Bassotto Unus – Furfante di Strada';
const fxMod=w=>w.name===UNUS&&w.cast==='giallo'&&w.base===1?1:0;
const fxBlock=w=>w.name===UNUS&&w.cast==='giallo'&&w.base>=4;
const wpow=w=>w.base+w.mod+fxMod(w);
const spell=id=>{const c=COLORS.find(x=>x.id===id),f=c?mix(c.hex,255,.32):'#e6dcc0';return `<svg class="csym" viewBox="0 0 24 24" aria-hidden="true"><g transform="skewX(-9) translate(3 0)" fill="none" stroke-linejoin="miter" stroke-linecap="butt"><polyline points="5,2 5,10 12,10 12,15 18,15 18,22" stroke="#3a2506" stroke-width="6.6"/><polyline points="5,3 5,10 12,10 12,15 18,15 18,21" stroke="${f}" stroke-width="3.2"/></g></svg>`};
const CASTLES=[];
const hpow=w=>w.hid===null?0:w.hid+w.hmod;
const penalty=p=>Math.max(0,new Set(p.wizards.map(w=>w.team).filter(Boolean)).size-1);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fmt=n=>n>0?'+'+n:String(n);

function renderCastle(){
  const el=document.getElementById('castle');
  el.style.cssText=kvars('#4b5f8a');
  el.innerHTML=`<svg class="tw" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V7h3v2h2V7h8v2h2V7h3v14z" fill="#f6d777" stroke="#3a2506" stroke-width="1.4" stroke-linejoin="round"/><path d="M10.5 21v-5a1.5 1.5 0 0 1 3 0v5z" fill="#3a2506"/></svg><span class="cn">Castello</span><button type="button" class="cbtn ${state.castle?'':'empty'}" data-act="castle" title="Tipologia di castello, valida per tutti i giocatori">${state.castle?esc(state.castle):'Scegli tipologia…'}</button>`;
}
function render(){
  renderCastle();
  document.getElementById('n').textContent=state.n;
  document.getElementById('minus').disabled=state.n<=1;
  document.getElementById('plus').disabled=state.n>=3;
  document.getElementById('reserve').innerHTML='<span>Riserva</span>'+COLORS.map(c=>`<span title="${c.label}">${gem(c.hex)}${reserve(c.id)}</span>`).join('');
  document.getElementById('app').innerHTML=act().map((p,pi)=>{
    const bg=p.bg?`background-image:url(${p.bg})`:`background-image:linear-gradient(135deg,hsl(${pi*40+255},55%,34%),hsl(${pi*40+215},65%,16%))`;
    const total=sum(p.owned), pen=penalty(p);
    const tp=Math.max(0,p.wizards.reduce((a,w)=>a+wpow(w)+hpow(w),0)-pen);
    return `<section class="player" style="${kvars(p.col)}"><i class="orn tl"></i><i class="orn tr"></i><i class="orn bl"></i><i class="orn br"></i><div class="inner" style="${bg}"><div class="shade">
      <div class="banner">
        <div class="ribbon"><i class="tail l"></i><i class="tail r"></i><input class="name" value="${esc(p.name)}" data-p="${pi}" data-act="name" aria-label="Nome giocatore"></div>
        <div class="hues" role="group" aria-label="Colore di banner e stendardo">${HUES.map(([h,n])=>`<button type="button" class="hue ${p.col===h?'on':''}" style="--h:${h}" data-p="${pi}" data-h="${h}" data-act="hue" aria-pressed="${p.col===h}" aria-label="${n}" title="${n}"></button>`).join('')}<label class="hue custom ${HUES.some(x=>x[0]===p.col)?'':'on'}" style="--h:${p.col}" title="Colore personalizzato"><input type="color" value="${p.col}" data-p="${pi}" data-act="huec" aria-label="Colore personalizzato"></label></div>
      </div>
      <div class="stats">
        <div class="power"><div class="orb"><span><b>${tp}</b></span><i class="tas"></i></div><div><div class="plabel">Potenza magica</div><div class="psub">maghi + magie nascoste</div>${pen?`<div class="pen">penalità team −${pen}</div>`:''}</div></div>
        <div class="dia"><span class="big">${gemAll()}${total}</span><small>Diamagic</small></div>
      </div>
      ${total>=6?'<div class="win">🏆 6 Diamagic: vittoria!</div>':''}
      <div class="pool"><div class="plabel">Aggiungi Diamagic</div><div class="poolrow">
        ${COLORS.map(c=>`<div class="chip" title="${c.label}">${gem(c.hex)}
          <button class="rb" data-p="${pi}" data-c="${c.id}" data-act="own-" ${p.owned[c.id]<=assigned(p,c.id)?'disabled':''}>−</button>
          <b>${p.owned[c.id]}</b>
          <button class="rb" data-p="${pi}" data-c="${c.id}" data-act="own+" ${reserve(c.id)<=0?'disabled':''}>+</button></div>`).join('')}
      </div></div>
      <div class="wizards">
        ${p.wizards.map((w,wi)=>{const pw=wpow(w);return `<div class="wslot">
          <div class="mod"><span>Mod. normale</span><select data-p="${pi}" data-w="${wi}" data-act="mod" aria-label="Modificatore potere magico">${MODS.map(m=>`<option value="${m}" ${m===w.mod?'selected':''}>${fmt(m)}</option>`).join('')}</select></div>
          <div class="mod"><span class="cl">${spell(w.cast)}Lanciata</span><select data-p="${pi}" data-w="${wi}" data-act="cast" aria-label="Colore della magia lanciata"><option value="">—</option>${COLORS.map(c=>`<option value="${c.id}" ${c.id===w.cast?'selected':''}>${c.label}</option>`).join('')}</select></div>
          ${fxMod(w)?`<div class="fx">Bassotto Unus: +${fxMod(w)} alla magia gialla</div>`:''}${fxBlock(w)?`<div class="fx bad">Non può lanciare magie gialle con potenza 4 o più</div>`:''}
          <div class="card3d rest"><div class="tilt"><div class="flipper ${w.flip?'flip':''}">
            <div class="card face front"><div>
              <button class="pickbtn ${w.name?'':'empty'}" data-p="${pi}" data-w="${wi}" data-act="pickcard" title="Scegli mago">${w.name?esc(w.name):'Scegli mago…'}</button>
              ${w.name?portrait(w,pi,wi):''}
              <div class="crest ${w.mod+fxMod(w)>0?'pos':w.mod+fxMod(w)<0?'neg':''}">${pw}</div>
              <div class="base"><button class="rb" data-p="${pi}" data-w="${wi}" data-act="b-" ${w.base<=0?'disabled':''}>−</button>magia ${w.base}<button class="rb" data-p="${pi}" data-w="${wi}" data-act="b+" ${w.base>=6?'disabled':''}>+</button></div>
              <div class="gems">${COLORS.map(c=>{
                const fc=p.owned[c.id]-assigned(p,c.id);
                return `<div class="chip">${gem(c.hex)}
                  <button class="rb" data-p="${pi}" data-w="${wi}" data-c="${c.id}" data-act="d-" ${w.dia[c.id]<=0?'disabled':''}>−</button>
                  <b>${w.dia[c.id]}</b>
                  <button class="rb" data-p="${pi}" data-w="${wi}" data-c="${c.id}" data-act="d+" ${fc<=0?'disabled':''}>+</button></div>`}).join('')}
              </div>
              <button class="flipbtn" data-p="${pi}" data-w="${wi}" data-act="flip">↻ Abilità e team</button>
            </div></div>
            <div class="card face back"><div>
              <div class="slabel">${esc(w.name||'Mago')}</div>
              <div class="team">Team <select data-p="${pi}" data-w="${wi}" data-act="team"><option value="">—</option>${TEAMS.map(t=>`<option ${t===w.team?'selected':''}>${t}</option>`).join('')}</select></div>
              ${w.color?`<div class="tag">Colore: ${w.color}</div>`:''}
              <div class="slabel">Abilità</div>
              <textarea class="ab tall" placeholder="Abilità del mago (scrivi il testo della carta)" data-p="${pi}" data-w="${wi}" data-act="ability">${esc(w.ability)}</textarea>
              <button class="flipbtn" data-p="${pi}" data-w="${wi}" data-act="flip">↻ Torna alla carta</button>
            </div></div>
          </div></div></div>
          <div class="hid"><div class="hhead"><span class="hl">Magia nascosta</span><span class="htot" title="Potenza della magia nascosta con il suo modificatore, sommata al totale">${w.hid===null?'—':fmt(hpow(w))}</span></div>
            ${w.hid!==null?`<div class="hlist"><div class="hcard"><button type="button" class="hx" data-p="${pi}" data-w="${wi}" data-act="hx" aria-label="Rimuovi magia nascosta" title="Rimuovi">×</button>
              <b>${w.hid}</b><div class="hs"><button class="rb" data-p="${pi}" data-w="${wi}" data-act="hm" aria-label="Meno potenza" ${w.hid<=0?'disabled':''}>−</button><button class="rb" data-p="${pi}" data-w="${wi}" data-act="hp" aria-label="Più potenza" ${w.hid>=20?'disabled':''}>+</button></div></div></div>
            <div class="mod"><span>Mod. nascosta</span><select data-p="${pi}" data-w="${wi}" data-act="hmod" aria-label="Modificatore magia nascosta">${MODS.map(m=>`<option value="${m}" ${m===w.hmod?'selected':''}>${fmt(m)}</option>`).join('')}</select></div>`:`<button class="flipbtn" data-p="${pi}" data-w="${wi}" data-act="hadd">＋ Magia lanciata nascosta</button>`}
          </div>
        </div>`}).join('')}
      </div></div></div></section>`;
  }).join('');
}

const TCOL={'Wizards of Mickey':['#ff8a3a','#6a2208'],'Magma Fire':['#ff5a2a','#5a0c08'],'Sventura':['#a566dc','#26104a'],'Luna Diamante':['#6cbcff','#0e2f6a'],'Black Phantom':['#7a7a8c','#0c0c14']};
function portrait(w,pi,wi){
  let inner;
  if(ART[w.name])inner=`<img src="${ART[w.name]}" alt="${esc(w.name.split(/ [–-] /)[0])}">`;
  else{const c=TCOL[w.team]||['#35b3ee','#0a3550'];const first=esc(w.name.split(/ [–-] /)[0]);
    inner=`<div class="ph" style="background:radial-gradient(circle at 50% 38%,${c[0]},${c[1]} 82%)"><svg viewBox="0 0 100 100"><path d="M52 6 L68 54 H34 Z" fill="rgba(255,255,255,.9)" stroke="rgba(0,0,0,.55)" stroke-width="3" stroke-linejoin="round"/><ellipse cx="50" cy="58" rx="40" ry="9" fill="rgba(255,255,255,.9)" stroke="rgba(0,0,0,.55)" stroke-width="3"/><circle cx="55" cy="34" r="3.5" fill="#ffc933"/></svg><span>${first}</span></div>`;}
  return `<div class="portrait">${inner}</div>`;
}
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
let popup=null;
function closePopup(){if(popup){popup.remove();popup=null;document.removeEventListener('mousedown',outside,true);document.removeEventListener('keydown',esc_,true)}}
function outside(e){if(popup&&!popup.contains(e.target))closePopup()}
function esc_(e){if(e.key==='Escape')closePopup()}
function openPicker(btn,items,onPick,ph){
  closePopup();
  popup=document.createElement('div');popup.className='popup';
  popup.innerHTML=`<input type="search" placeholder="${ph}" aria-label="Cerca"><ul></ul>`;
  document.body.appendChild(popup);
  const r=btn.getBoundingClientRect(),w=Math.min(Math.max(r.width,280),window.innerWidth-16);
  popup.style.width=w+'px';
  popup.style.left=Math.max(8,Math.min(r.left,window.innerWidth-w-8))+'px';
  const below=window.innerHeight-r.bottom;
  if(below<260&&r.top>below){popup.style.bottom=(window.innerHeight-r.top+4)+'px';popup.style.maxHeight=Math.min(380,r.top-12)+'px'}
  else{popup.style.top=(r.bottom+4)+'px';popup.style.maxHeight=Math.min(380,below-12)+'px'}
  const inp=popup.querySelector('input'),ul=popup.querySelector('ul');
  function draw(){
    const q=norm(inp.value.trim());
    const f=items.filter(it=>!q||norm(it.label+' '+(it.sub||'')).includes(q)).slice(0,120);
    let h=f.map(it=>`<li data-i="${items.indexOf(it)}">${esc(it.label)}${it.sub?`<small>${esc(it.sub)}</small>`:''}</li>`).join('');
    if(q&&!items.some(it=>norm(it.label)===q))h+=`<li data-custom="1">＋ Usa “${esc(inp.value.trim())}”</li>`;
    ul.innerHTML=h||'<div class="none">Nessun risultato</div>';
  }
  draw();
  inp.addEventListener('input',draw);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const li=ul.querySelector('li');if(li)li.click()}});
  ul.addEventListener('click',e=>{
    const li=e.target.closest('li');if(!li)return;
    if(li.dataset.custom)onPick({custom:inp.value.trim()});else onPick(items[+li.dataset.i]);
    closePopup();
  });
  setTimeout(()=>{document.addEventListener('mousedown',outside,true);document.addEventListener('keydown',esc_,true)},0);
  inp.focus();
}
const WIZITEMS=[{label:'— Nessun mago —',clear:1},...ROSTER.map(r=>({label:r.n,sub:r.t,r}))];
document.getElementById('castle').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act="castle"]');if(!b)return;
  openPicker(b,[{label:'— Nessun castello —',clear:1},...CASTLES.map(n=>({label:n}))],it=>{
    if(it.clear)state.castle='';else if(it.custom){state.castle=it.custom;if(!CASTLES.includes(it.custom))CASTLES.push(it.custom);}else state.castle=it.label;
    render();},'Cerca o scrivi il castello…');
});
const app=document.getElementById('app');
app.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;
  const p=state.players[+b.dataset.p],c=b.dataset.c,w=p.wizards[+b.dataset.w];
  switch(b.dataset.act){
    case 'flip':w.flip=!w.flip;b.closest('.flipper').classList.toggle('flip');return;
    case 'pickcard':openPicker(b,WIZITEMS,it=>{
      if(it.clear){w.name='';w.card='';w.color='';w.ability='';w.team='';}
      else if(it.custom){w.name=it.custom;w.card='x';w.color='';w.ability='';}
      else{const r=it.r;w.name=r.n;w.card='r';w.team=r.t||w.team;w.color=r.c;w.ability=r.a;}
      render();},'Cerca mago…');return;
    case 'hadd':w.hid=1;break;
    case 'hp':w.hid=Math.min(20,(w.hid||0)+1);break;
    case 'hm':w.hid=Math.max(0,(w.hid||0)-1);break;
    case 'hx':w.hid=null;w.hmod=0;break;
    case 'hue':p.col=b.dataset.h;break;
    case 'own+':if(reserve(c)>0)p.owned[c]++;break;
    case 'own-':if(p.owned[c]>assigned(p,c))p.owned[c]--;break;
    case 'd+':if(p.owned[c]-assigned(p,c)>0)w.dia[c]++;break;
    case 'd-':if(w.dia[c]>0)w.dia[c]--;break;
    case 'b+':w.base=Math.min(6,w.base+1);break;
    case 'b-':w.base=Math.max(0,w.base-1);break;
  }
  render();
});
app.addEventListener('input',e=>{
  const t=e.target,p=state.players[+t.dataset.p];if(!p)return;
  if(t.dataset.act==='name')p.name=t.value;
  if(t.dataset.act==='huec'){p.col=t.value;t.closest('.player').style.cssText=kvars(p.col);}
  if(t.dataset.act==='wname')p.wizards[+t.dataset.w].name=t.value;
  if(t.dataset.act==='ability')p.wizards[+t.dataset.w].ability=t.value;
});
app.addEventListener('change',e=>{
  const t=e.target,p=state.players[+t.dataset.p];if(!p)return;
  if(t.dataset.act==='huec'){p.col=t.value;render();}
  if(t.dataset.act==='cast'){p.wizards[+t.dataset.w].cast=t.value;render();}
  if(t.dataset.act==='hmod'){p.wizards[+t.dataset.w].hmod=+t.value;render();}
  if(t.dataset.act==='mod'){p.wizards[+t.dataset.w].mod=+t.value;render();}
  if(t.dataset.act==='team'){p.wizards[+t.dataset.w].team=t.value;render();}
  if(t.dataset.act==='card'){
    const w=p.wizards[+t.dataset.w];w.card=t.value;
    if(t.value===''){w.name='';w.color='';w.ability='';}
    else if(t.value==='x'){w.name='';w.color='';}
    else{const r=ROSTER[+t.value];w.name=r.n;w.team=r.t;w.color=r.c;w.ability=r.a;}
    render();
  }
});
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function resetTilt(c){const t=c.firstElementChild;t.style.setProperty('--rx','0deg');t.style.setProperty('--ry','0deg');t.style.setProperty('--go',0);c.classList.add('rest')}
app.addEventListener('pointermove',e=>{if(reduce)return;const c=e.target.closest('.card3d');if(!c)return;
  const t=c.firstElementChild,r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  t.style.setProperty('--ry',((x-.5)*10).toFixed(1)+'deg');t.style.setProperty('--rx',((.5-y)*9).toFixed(1)+'deg');
  t.style.setProperty('--gx',(x*100).toFixed(0)+'%');t.style.setProperty('--gy',(y*100).toFixed(0)+'%');t.style.setProperty('--go',1);c.classList.remove('rest')});
app.addEventListener('pointerout',e=>{const c=e.target.closest('.card3d');if(c&&!c.contains(e.relatedTarget))resetTilt(c)});
app.addEventListener('pointerup',e=>{if(e.pointerType==='touch'){const c=e.target.closest('.card3d');if(c)setTimeout(()=>resetTilt(c),350)}});
(()=>{const b=document.getElementById('reset');let t=0;const idle='↺ Nuova partita';
  const back=()=>{clearTimeout(t);b.textContent=idle;b.dataset.ask=''};
  b.onclick=()=>{
    if(b.dataset.ask){back();closePopup();state.n=2;state.castle='';state.players=[mkPlayer(0),mkPlayer(1),mkPlayer(2)];render();window.scrollTo({top:0,behavior:'smooth'});return}
    b.dataset.ask='1';b.textContent='Azzerare tutto? Tocca di nuovo';t=setTimeout(back,4000)};
})();
(function sky(){const el=document.getElementById('sky'),n=26,ps=[];
  for(let i=0;i<n;i++){const d=document.createElement('i');d.className='sp';const z=Math.random();const sz=2+z*5;
    d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--t:${3+Math.random()*4}s;animation-delay:${-Math.random()*6}s`;
    d.dataset.z=z;el.appendChild(d);ps.push(d)}
  if(reduce)return;let raf=0;
  addEventListener('pointermove',e=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
    const mx=e.clientX/innerWidth-.5,my=e.clientY/innerHeight-.5;
    ps.forEach(d=>{const z=+d.dataset.z;d.style.transform=`translate(${-mx*60*z}px,${-my*60*z}px)`})})});
})();
document.getElementById('plus').onclick=()=>{if(state.n<3){state.n++;render();}};
document.getElementById('minus').onclick=()=>{if(state.n>1){state.n--;render();}};
render();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
